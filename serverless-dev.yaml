service: admin-customer-support
frameworkVersion: "3"

custom:
  serverlessSsmFetch: {}
  prune:
    automatic: true
    number: 3
    
provider:
  name: aws
  runtime: nodejs20.x
  region: eu-west-1
  stage: ${opt:stage, 'dev'}
  versionFunctions: false

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - s3:PutObject
            - s3:GetObject
            - s3:DeleteObject
          Resource:
            - arn:aws:s3:::customer-support-attachments-${self:provider.stage}/*

        - Effect: Allow
          Action:
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:GetItem
            - dynamodb:Query
            - dynamodb:Scan
            - dynamodb:DeleteItem
          Resource:
            - arn:aws:dynamodb:eu-west-1:${aws:accountId}:table/support-tickets-${self:provider.stage}
            - arn:aws:dynamodb:eu-west-1:${aws:accountId}:table/support-tickets-${self:provider.stage}/index/*
            - arn:aws:dynamodb:eu-west-1:${aws:accountId}:table/ticket-reasons-${self:provider.stage}
            - arn:aws:dynamodb:eu-west-1:${aws:accountId}:table/ticket-status-${self:provider.stage}
            - arn:aws:dynamodb:eu-west-1:${aws:accountId}:table/ticket-history-${self:provider.stage}
            - arn:aws:dynamodb:eu-west-1:${aws:accountId}:table/ticket-history-${self:provider.stage}/index/*
            - arn:aws:dynamodb:eu-west-1:${aws:accountId}:table/internal-notes-${self:provider.stage}
            - arn:aws:dynamodb:eu-west-1:${aws:accountId}:table/internal-notes-${self:provider.stage}/index/*

        - Effect: Allow
          Action:
            - sqs:SendMessage
          Resource:
            - arn:aws:sqs:eu-west-1:${aws:accountId}:error-log-queue-${self:provider.stage}

        - Effect: Allow
          Action:
            - appsync:GraphQL
          Resource:
            - arn:aws:appsync:eu-west-1:${aws:accountId}:apis/*/types/Mutation/fields/*

  environment:
    STAGE: ${self:provider.stage}
    SUPPORT_TICKETS_TABLE: support-tickets-${self:provider.stage}
    TICKET_REASONS_TABLE: ticket-reasons-${self:provider.stage}
    TICKET_STATUS_TABLE: ticket-status-${self:provider.stage}
    TICKET_HISTORY_TABLE: ticket-history-${self:provider.stage}
    INTERNAL_NOTES_TABLE: internal-notes-${self:provider.stage}
    ATTACHMENTS_BUCKET: customer-support-attachments-${self:provider.stage}
    ERROR_LOG_QUEUE_URL: https://sqs.eu-west-1.amazonaws.com/${aws:accountId}/error-log-queue-${self:provider.stage}
    APPSYNC_ENDPOINT: !Sub 'https://${TicketEventsApi.GraphQLEndpoint}'
    APPSYNC_API_KEY: !GetAtt TicketEventsApiKey.ApiKey

package:
  patterns:
    - '!./**'
    - handlers/**
    - helper/**
    - lib/**
    - package.json
    - package-lock.json
    - node_modules/**
    - '!node_modules/aws-sdk/**'
    - '!node_modules/**/test/**'
    - '!node_modules/**/tests/**'
    - '!node_modules/**/docs/**'
    - '!node_modules/**/examples/**'
    - '!node_modules/**/*.md'
    - '!node_modules/**/*.ts'
    - '!node_modules/**/*.map'
  excludeDevDependencies: true

functions:
  # Ticket Management Functions
  createTicket:
    handler: handlers/createTicket.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /ticket
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-API-KEY
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  updateTicket:
    handler: handlers/updateTicket.handler
    timeout: 30
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /ticket/{ticketId}
          method: put
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-API-KEY
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  getAllTickets:
    handler: handlers/getAllTickets.handler
    timeout: 30
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /tickets
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-API-KEY
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  getPendingTicketsCount:
    handler: handlers/getPendingTicketsCount.handler
    timeout: 30
    memorySize: 512
    events:
      - http:
          path: /tickets/pending/count
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-API-KEY
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  getTicketById:
    handler: handlers/getTicketById.handler
    timeout: 30
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /ticket/{ticketId}
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-API-KEY
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  deleteTicket:
    handler: handlers/deleteTicket.handler
    timeout: 30
    memorySize: 512
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /ticket/{ticketId}
          method: delete
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-API-KEY
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  getReasons:
    handler: handlers/getReasons.handler
    timeout: 30
    memorySize: 256
    events:
      - http:
          path: /reasons
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-API-KEY
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  # Internal Notes Functions
  addInternalNote:
    handler: handlers/addInternalNote.handler
    timeout: 30
    memorySize: 256
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /ticket/{ticketId}/notes
          method: post
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-API-KEY
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

  getInternalNotes:
    handler: handlers/getInternalNotes.handler
    timeout: 30
    memorySize: 256
    layers:
      - arn:aws:lambda:eu-west-1:${aws:accountId}:layer:authorizerLayer:11
    events:
      - http:
          path: /ticket/{ticketId}/notes
          method: get
          cors:
            origin: '*'
            headers:
              - Content-Type
              - X-API-KEY
              - user_type
              - user_id
              - Authorization
            allowCredentials: true

resources:
  Resources:
   
    ###########################
    ### AppSync API
    ###########################
    TicketEventsApi:
      Type: AWS::AppSync::GraphQLApi
      Properties:
        Name: ticket-events-api-${self:provider.stage}
        AuthenticationType: API_KEY
        ApiKeyConfig:
          Description: API Key for ticket events
          Expires: 365

    TicketEventsApiKey:
      Type: AWS::AppSync::ApiKey
      Properties:
        ApiId: !GetAtt TicketEventsApi.ApiId
        Description: API Key for ticket events
        Expires: !Sub '${AWS:Epoch + 31536000}'

    TicketEventsSchema:
      Type: AWS::AppSync::GraphQLSchema
      Properties:
        ApiId: !GetAtt TicketEventsApi.ApiId
        Definition: |
          type Query {
            dummy: String
          }

          type Mutation {
            publishTicketCreated(input: TicketCreatedInput!): TicketCreatedEvent
            publishTicketUpdated(input: TicketUpdatedInput!): TicketUpdatedEvent
          }

          type Subscription {
            onTicketCreated: TicketCreatedEvent
              @aws_subscribe(mutations: ["publishTicketCreated"])
            onTicketUpdated: TicketUpdatedEvent
              @aws_subscribe(mutations: ["publishTicketUpdated"])
          }

          input TicketCreatedInput {
            ticketId: String!
            name: String!
            email: String!
            reason: String!
            status: String!
            createdAt: String!
          }

          type TicketCreatedEvent {
            ticketId: String!
            name: String!
            email: String!
            reason: String!
            status: String!
            createdAt: String!
          }

          input TicketUpdatedInput {
            ticketId: String!
            changes: String!
            updatedAt: String!
          }

          type TicketUpdatedEvent {
            ticketId: String!
            changes: String!
            updatedAt: String!
          }

    TicketCreatedDataSource:
      Type: AWS::AppSync::DataSource
      Properties:
        ApiId: !GetAtt TicketEventsApi.ApiId
        Name: TicketCreatedDataSource
        Type: NONE

    TicketUpdatedDataSource:
      Type: AWS::AppSync::DataSource
      Properties:
        ApiId: !GetAtt TicketEventsApi.ApiId
        Name: TicketUpdatedDataSource
        Type: NONE

    PublishTicketCreatedResolver:
      Type: AWS::AppSync::Resolver
      Properties:
        ApiId: !GetAtt TicketEventsApi.ApiId
        TypeName: Mutation
        FieldName: publishTicketCreated
        DataSourceName: !GetAtt TicketCreatedDataSource.Name
        Kind: UNIT
        RequestMappingTemplate: |
          {
            "version": "2017-02-28",
            "payload": $util.toJson($input)
          }
        ResponseMappingTemplate: |
          $util.toJson($payload)

    PublishTicketUpdatedResolver:
      Type: AWS::AppSync::Resolver
      Properties:
        ApiId: !GetAtt TicketEventsApi.ApiId
        TypeName: Mutation
        FieldName: publishTicketUpdated
        DataSourceName: !GetAtt TicketUpdatedDataSource.Name
        Kind: UNIT
        RequestMappingTemplate: |
          {
            "version": "2017-02-28",
            "payload": $util.toJson($input)
          }
        ResponseMappingTemplate: |
          $util.toJson($payload)

    ###########################
    ### S3 Buckets
    ###########################
    AttachmentsBucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: customer-support-attachments-${self:provider.stage}
        CorsConfiguration:
          CorsRules:
            - AllowedOrigins:
                - '*'
              AllowedMethods:
                - GET
                - PUT
                - POST
                - DELETE
              AllowedHeaders:
                - '*'
              MaxAge: 3000

    ###########################
    ### DynamoDB Tables
    ###########################
    SupportTicketsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: support-tickets-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: ticketId
            AttributeType: S
          - AttributeName: email
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: assignedTo
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: ticketId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: EmailIndex
            KeySchema:
              - AttributeName: email
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: StatusIndex
            KeySchema:
              - AttributeName: status
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: AssignedToIndex
            KeySchema:
              - AttributeName: assignedTo
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    TicketHistoryTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: ticket-history-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: historyId
            AttributeType: S
          - AttributeName: ticketId
            AttributeType: S
          - AttributeName: timestamp
            AttributeType: S
        KeySchema:
          - AttributeName: historyId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: TicketIdIndex
            KeySchema:
              - AttributeName: ticketId
                KeyType: HASH
              - AttributeName: timestamp
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    InternalNotesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        TableName: internal-notes-${self:provider.stage}
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: noteId
            AttributeType: S
          - AttributeName: ticketId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: S
        KeySchema:
          - AttributeName: noteId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: TicketIdIndex
            KeySchema:
              - AttributeName: ticketId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

  Outputs:
    AttachmentsBucketName:
      Value: !Ref AttachmentsBucket
    TicketEventsApiEndpoint:
      Value: !Sub 'https://${TicketEventsApi.GraphQLEndpoint}'
      Description: AppSync GraphQL Endpoint for ticket events
    TicketEventsApiKey:
      Value: !GetAtt TicketEventsApiKey.ApiKey
      Description: API Key for ticket events AppSync API

plugins:
  - serverless-ssm-fetch
  - serverless-prune-plugin
